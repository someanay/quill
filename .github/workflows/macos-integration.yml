name: macOS editor integration

on:
  push:
    paths:
      - "macos/QA/**"
      - "macos/scripts/test-textedit.sh"
      - "macos/scripts/test-fields.sh"
      - "macos/project.yml"
      - "macos/QuillMac/Services/TextInjector.swift"
      - "macos/QuillMac/Services/AccessibilityAccess.swift"
      - "macos/QuillCore/**"
      - ".github/workflows/macos-integration.yml"
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-integration.yml"]
  workflow_dispatch:
    inputs:
      live_providers:
        description: Run owner-authorized live providers instead of ordinary editor verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-textedit-${{ github.ref }}-${{ inputs.live_providers || false }}
  cancel-in-progress: true

jobs:
  live:
    if: inputs.live_providers == true
    uses: ./.github/workflows/live-providers.yml
    with:
      platform: macos
    secrets:
      QUILL_LIVE_GEMINI_KEY: ${{ secrets.QUILL_LIVE_GEMINI_KEY }}
      QUILL_LIVE_OPENROUTER_KEY: ${{ secrets.QUILL_LIVE_OPENROUTER_KEY }}
  textedit:
    if: inputs.live_providers != true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Recover the Intel macOS 26 icon-service crash loop
        if: matrix.runner == 'macos-26-intel'
        run: bash macos/QA/prepare-ci-icon-services.sh
      - name: Exercise production insertion against real TextEdit
        run: bash macos/scripts/test-textedit.sh
      - name: Preserve actual permission and insertion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-textedit-verification-${{ matrix.runner }}
          path: |
            macos/TextEditEvidence
            macos/IconServicesEvidence
          if-no-files-found: warn
          retention-days: 14
  browser-and-secure-fields:
    if: inputs.live_providers != true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Recover the Intel macOS 26 icon-service crash loop
        if: matrix.runner == 'macos-26-intel'
        run: bash macos/QA/prepare-ci-icon-services.sh
      - name: Exercise production insertion against Safari and native secure fields
        run: bash macos/scripts/test-fields.sh
      - name: Preserve browser and secure-field evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-fields-verification-${{ matrix.runner }}
          path: |
            macos/FieldEvidence
            macos/IconServicesEvidence
          if-no-files-found: warn
          retention-days: 14
