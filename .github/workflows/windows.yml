name: Windows build and test

on:
  push:
    paths: ["windows/**", "tests/parity/**", "scripts/verify-platform-parity.py", "scripts/check-copy-usage.py", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "tests/parity/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify bundled copy and fonts
        run: python scripts/verify-platform-parity.py --platform windows --independent-copy
      - name: Build and test Windows app
        run: dotnet test windows/Quill.Windows.slnx -c Release --logger "trx;LogFileName=windows-tests.trx" --results-directory dist/verification/windows-tests
      - name: Verify installer integrity and safe uninstall
        run: ./windows/installer/Test-Installer.ps1
      - name: Package self-contained x64 application and installer
        run: ./windows/installer/Publish-Quill.ps1 -Runtime win-x64 -SkipTests
      - name: Cross-compile and package ARM64 application
        run: ./windows/installer/Publish-Quill.ps1 -Runtime win-arm64 -SkipTests
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Quill-Windows-packages
          path: |
            dist/windows/*.zip
            dist/windows/*.zip.sha256
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            dist/verification/windows-tests
            dist/verification/installer-tests/**/results.json
          retention-days: 14
