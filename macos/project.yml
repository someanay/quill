# XcodeGen spec for Quill (macOS). On a Mac:
#   brew install xcodegen
#   cd macos && xcodegen generate && open QuillMac.xcodeproj
# Then set your Development Team in Signing & Capabilities and Run.
name: QuillMac
options:
  bundleIdPrefix: com.tihor.quill
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: Quill
    INFOPLIST_KEY_LSUIElement: YES          # menu-bar / agent app (no Dock icon)
targets:
  QuillMac:
    type: application
    platform: macOS
    sources:
      - path: QuillMac
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.mac
        PRODUCT_MODULE_NAME: QuillMac
        INFOPLIST_FILE: QuillMac/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuillMac/App/QuillMac.entitlements
    # No third-party dependencies: URLSession, AVFoundation, AppKit, Carbon, Security,
    # ApplicationServices (Accessibility) are all system frameworks.
  QuillMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [QuillMacTests]
    dependencies:
      - target: QuillMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.mac.tests
        # Host the tests in the app so @testable import QuillMac resolves.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quill.app/Contents/MacOS/Quill"
        BUNDLE_LOADER: "$(TEST_HOST)"
