name: QuillMac
options:
  bundleIdPrefix: com.tihor.quill
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  QuillCore:
    path: QuillCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  QuillMac:
    type: application
    platform: macOS
    sources:
      - path: QuillMac
        excludes: [Resources, "App/Info.plist", "App/QuillMac.entitlements"]
      - path: QuillMac/Resources/Assets.xcassets
        buildPhase: resources
      - path: QuillMac/Resources/copy
        type: folder
        buildPhase: resources
      - path: QuillMac/Resources/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: QuillCore
      - sdk: libsqlite3.tbd
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
      - sdk: AVFoundation.framework
      - sdk: Contacts.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: Quill
        PRODUCT_MODULE_NAME: QuillMac
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.mac
        INFOPLIST_FILE: QuillMac/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuillMac/App/QuillMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Verify bundled copy and fonts
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/copy/strings.default.json"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/fonts/ibm_plex_sans.ttf"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/fonts/ibm_plex_serif.ttf"
        script: |
          set -eu
          test -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/copy/strings.default.json"
          test -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/fonts/ibm_plex_sans.ttf"
          test -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/fonts/ibm_plex_serif.ttf"
  QuillMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [QuillMacTests]
    dependencies:
      - target: QuillMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quill.app/Contents/MacOS/Quill"
        BUNDLE_LOADER: "$(TEST_HOST)"
  QuillMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [QuillMacUITests]
    dependencies:
      - target: QuillMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QuillMac
  QuillAXProbe:
    type: tool
    platform: macOS
    sources:
      - path: QA/TextEditProbe.swift
      - path: QuillMac/Services/TextInjector.swift
      - path: QuillMac/Services/AccessibilityAccess.swift
    dependencies:
      - package: QuillCore
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
    settings:
      base:
        PRODUCT_NAME: QuillAXProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.mac.qa.axprobe
        GENERATE_INFOPLIST_FILE: YES
  QuillFieldProbe:
    type: tool
    platform: macOS
    sources:
      - path: QA/FieldProbe.swift
      - path: QuillMac/Services/TextInjector.swift
      - path: QuillMac/Services/AccessibilityAccess.swift
    dependencies:
      - package: QuillCore
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
    settings:
      base:
        PRODUCT_NAME: QuillFieldProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.mac.qa.fieldprobe
        GENERATE_INFOPLIST_FILE: YES
  QuillAXFixture:
    type: application
    platform: macOS
    sources:
      - path: QA/FieldFixture.swift
    dependencies:
      - sdk: AppKit.framework
    settings:
      base:
        PRODUCT_NAME: QuillAXFixture
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.mac.qa.fields
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
  QuillLiveProbe:
    type: tool
    platform: macOS
    sources:
      - path: QA/LiveProviderProbe.swift
      - path: ../tests/live/AppleLiveAudit.swift
      - path: QuillMac/Services
    dependencies:
      - package: QuillCore
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - sdk: Contacts.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_NAME: QuillLiveProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.mac.qa.live
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Quill live provider QA records synthetic loopback speech on an isolated test runner.
schemes:
  QuillMac:
    build:
      targets:
        QuillMac: all
    test:
      targets: [QuillMacTests, QuillMacUITests]
      gatherCoverageData: true
  QuillAXProbe:
    build:
      targets:
        QuillAXProbe: all
  QuillFieldProbe:
    build:
      targets:
        QuillFieldProbe: all
        QuillAXFixture: all
  QuillLiveProbe:
    build:
      targets:
        QuillLiveProbe: all
