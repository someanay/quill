name: Quill
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  QuillCore:
    path: QuillCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  Quill:
    type: application
    platform: iOS
    sources:
      - path: Quill
        excludes: [Resources]
      - path: Shared
      - path: Quill/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Quill/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Quill/App/Quill.entitlements
    dependencies:
      - package: QuillCore
      - target: QuillKeyboard
        embed: true
      - sdk: libsqlite3.tbd
    scheme:
      testTargets: [QuillTests, QuillUITests]
      gatherCoverageData: true
  QuillKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: QuillKeyboard
      - path: Shared
      - path: Quill/Resources
        buildPhase: resources
        excludes: [Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.ios.keyboard
        INFOPLIST_FILE: QuillKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuillKeyboard/QuillKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: QuillCore
  QuillTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QuillTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.ios.tests
    dependencies:
      - target: Quill
      - package: QuillCore
  QuillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [QuillUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tihor.quill.ios.uitests
    dependencies:
      - target: Quill
